name: Build Package

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run test suite
        run: node tests/run.js

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: ipk
            sdk_url: https://downloads.openwrt.org/releases/24.10.8/targets/x86/64/openwrt-sdk-24.10.8-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            pkg_ext: ipk
          - artifact: apk
            sdk_url: https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            pkg_ext: apk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: package-dir

      - name: Download SDK
        run: |
          curl -fsSL --retry 10 --retry-delay 15 "${{ matrix.sdk_url }}" -o sdk.tar.zst

      - name: Extract SDK
        run: |
          tar -xf sdk.tar.zst
          mv openwrt-sdk-* sdk

      - name: Copy package to SDK
        run: |
          mkdir -p sdk/package/luci-app-wifimanager
          cp -r package-dir/* sdk/package/luci-app-wifimanager/

      - name: Install feeds
        run: |
          cd sdk
          sed -e 's/^src-git-full /src-git /' feeds.conf.default > feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 显式选中中文：i18n 子包的 DEFAULT 是 LUCI_LANG_zh_Hans||(ALL&&m)。
          # SDK 自带 CONFIG_ALL=y，本就落到 m，这里显式置 y 以免依赖该默认值。
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          make defconfig

      - name: Build package
        run: |
          cd sdk
          # 只需目录级目标：luci.mk 的 LuciTranslation 在同一个 Makefile 里求值，
          # i18n 子包与该目录同属一个 builddir，会一并编译。
          # 注意不存在 package/luci-i18n-wifimanager-zh-cn/compile 这个目标。
          make -j"$(nproc)" package/luci-app-wifimanager/compile V=s

      - name: Verify package metadata
        run: |
          cd sdk
          case "${{ matrix.pkg_ext }}" in
            ipk)
              for f in bin/packages/*/base/luci-app-wifimanager_*.ipk; do
                [ -e "$f" ] || { echo "no ipk found"; exit 1; }
                f=$(realpath "$f")
                d=$(mktemp -d)
                ( cd "$d" && tar -xzf "$f" ./control.tar.gz \
                  && tar -xzf control.tar.gz ./control \
                  && grep -qx 'URL: https://github.com/Arthur97172/luci-app-wifimanager' control \
                  && grep -qx 'Maintainer: Arthur97172 <Arthur97172@users.noreply.github.com>' control ) \
                  || { echo "wrong package metadata in $f"; exit 1; }
                rm -rf "$d"
              done
              ;;
            apk)
              APK=$(find staging_dir/host -type f -name apk -perm -u+x | head -1)
              for f in bin/packages/*/base/luci-app-wifimanager-*.apk; do
                [ -e "$f" ] || { echo "no apk found"; exit 1; }
                "$APK" adbdump "$f" | grep -q 'url: https://github.com/Arthur97172/luci-app-wifimanager' \
                  || { echo "wrong URL in $f"; exit 1; }
                "$APK" adbdump "$f" | grep -q 'maintainer: Arthur97172 <Arthur97172@users.noreply.github.com>' \
                  || { echo "wrong maintainer in $f"; exit 1; }
              done
              ;;
          esac

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          find sdk/bin/packages -type f -name "luci-*wifimanager*.${{ matrix.pkg_ext }}" -exec cp {} artifacts/ \;
          # 不能用 test -s artifacts/*：多个产物时 glob 展开成多参数，test 会报 binary operator expected
          [ -n "$(ls -A artifacts 2>/dev/null)" ] || { echo "No artifact found!"; exit 1; }
          # 翻译包缺失说明 i18n 子包没被编译出来，直接失败以便尽早发现
          ls artifacts/ | grep -q "luci-i18n-wifimanager" || { echo "i18n package missing!"; exit 1; }
          ls -lh artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/
          if-no-files-found: ignore

  release:
    needs: build
    if: ${{ success() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read version from Makefile
        id: version
        run: |
          VER=$(sed -n 's/^PKG_VERSION:=//p' Makefile | tr -d '[:space:]')
          REL=$(sed -n 's/^PKG_RELEASE:=//p' Makefile | tr -d '[:space:]')
          PKGVER="${VER}-r${REL}"
          echo "PKGVER=${PKGVER}" >> "$GITHUB_OUTPUT"
          echo "包版本：${PKGVER}"

      - name: Download ipk artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ipk
          path: artifacts

      - name: Download apk artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: apk
          path: artifacts

      - name: Verify artifacts
        run: |
          mkdir -p artifacts
          missing=""
          compgen -G 'artifacts/*.ipk' >/dev/null || missing="$missing .ipk"
          compgen -G 'artifacts/*.apk' >/dev/null || missing="$missing .apk"
          if [ -n "$missing" ]; then
            echo "缺少构建产物：$missing；保留现有 Release，不发布不完整的版本"
            exit 1
          fi
          ls -lh artifacts/

      - name: Generate release body
        run: |
          missing=""
          {
            printf '自动编译的插件包（版本 %s）\n\n' "${{ steps.version.outputs.PKGVER }}"
            if compgen -G 'artifacts/*.ipk' >/dev/null; then
              printf -- '- `.ipk`（opkg）— OpenWrt/ImmortalWrt 24.10 及更早\n'
            else
              missing="${missing:+$missing、}.ipk"
            fi
            if compgen -G 'artifacts/*.apk' >/dev/null; then
              printf -- '- `.apk`（apk）— OpenWrt/ImmortalWrt 25.12+\n'
            else
              missing="${missing:+$missing、}.apk"
            fi
            printf -- '- 架构无关（ipk 为 `all`，apk 为 `noarch`）：JS 前端与 shell 脚本包，同一份产物同时支持 ARM / x86 / MIPS 等所有平台\n'
            printf -- '- `luci-i18n-wifimanager-zh-cn`：中文翻译包，单独安装；不装则界面显示英文\n'
            printf -- '- 运行依赖 luci-base、rpcd-mod-iwinfo、kmod-cfg80211、kmod-batman-adv、batctl-default、luci-proto-batman-adv、iw、socat、flock、jshn、openssl-util；固件源缺少其中任何一个时安装会被拒绝\n'
            if [ -n "$missing" ]; then
              printf '\n注意：本次构建缺少：%s（详见 Actions 构建日志）\n' "$missing"
            fi
          } > release_body.md
          cat release_body.md

      - name: Delete existing release/tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKGVER="${{ steps.version.outputs.PKGVER }}"
          gh release delete "$PKGVER" -y --cleanup-tag 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$PKGVER" 2>/dev/null || true

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.PKGVER }}
          name: ${{ steps.version.outputs.PKGVER }}
          body_path: release_body.md
          files: artifacts/*
          token: ${{ github.token }}
          make_latest: true
